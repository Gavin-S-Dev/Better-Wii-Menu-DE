name: Better Wii Menu DE Windows

on:
  workflow_dispatch:
  push:
    branches: [better-wii-menu-de, 'publish/**']
  pull_request:
    branches: [better-wii-menu-de]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Record upstream baseline
        shell: pwsh
        run: |
          git fetch https://github.com/dolphin-emu/dolphin.git tag 2609a --no-tags
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git show-ref --verify --quiet refs/heads/master
          if ($LASTEXITCODE -ne 0) {
            git branch master refs/tags/2609a
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          exit 0

      - name: Prepare pinned compiler and release runtime
        run: python Tools/setup_fork_compiler.py

      - name: Check release packaging exclusions
        run: python -m unittest discover -s Tools/tests -p test_package_fork.py

      - name: Build application and tests
        shell: pwsh
        run: |
          cmd /c build_fork.cmd 2>&1 | Tee-Object -FilePath build-candidate-build.log
          exit $LASTEXITCODE

      - name: Run complete regression suite
        shell: pwsh
        run: |
          & build-candidate/Binaries/Tests/tests.exe --gtest_output=xml:build-candidate/test-results.xml
          exit $LASTEXITCODE

      - name: Require clean source
        shell: pwsh
        run: |
          $status = git status --porcelain --untracked-files=normal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($status) { throw "Refusing to package changed source: $status" }

      - name: Package candidate
        run: python Tools/package_fork.py

      - name: Upload candidate ZIP and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: BetterWiiMenuDE-windows-candidate
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.sha256

      - name: Retain build and test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: BetterWiiMenuDE-windows-diagnostics
          if-no-files-found: ignore
          path: |
            build-candidate-build.log
            build-candidate/test-results.xml
